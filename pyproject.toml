[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "corr_vars"
dynamic = ["version"]
description = "Build reproducible clinical study cohorts from ICU and hospital data sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Moritz Thiele", email = "moritz.thiele@charite.de"},
    {name = "Pedram Ramezani", email = "pedram.ramezani@charite.de"},
]
maintainers = [
    {email = "noel.kronenberg@charite.de"},
    {email = "dario.von-wedel@charite.de"},
]
keywords = ["clinical research", "cohort", "ICU", "electronic health records", "epidemiology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Main
    "corr_vars_widget>=0.0.8",
    "numpy>=2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.0.0",
    "polars==1.44.1",
    "tableone>=0.7.10",
    "scipy>=1.10.0",
    "tqdm>=4.65",
    "xlsxwriter>=3.2.5",
    "zstandard>=0.23.0",
    # Plot
    "matplotlib>=3.10.8",
    "networkx>=3.4.1",
    "seaborn>=0.13.2",
    "httpx>=0.27",
    "tomli>=2.0 ; python_full_version < '3.11'",
    "scikit-learn>=1.6.1,<1.7",
    # charite_demo source (DuckDB over Parquet)
    # ibis 12 calls fetch_arrow_table(), deprecated (warns) from duckdb 1.5 on
    "duckdb>=1.1,<1.5",
    "ibis-framework[duckdb]>=10.0",
]

[project.optional-dependencies]
# Optional bootstrap of a PyStata session (``CORR_VARS_STATA_DIR``). Cohort's
# Stata *export* works without it.
stata = ["stata_setup>=0.1.3"]
# Comorbidity scores (``comorbidity`` in charite_demo's py snippet namespace).
charite-demo = ["pycomorb>=0.5.2"]

[dependency-groups]
test = [
    "hypothesis>=6.151.3",
    "pytest>=8.3.3",
    "pytest-xdist>=3.6.1",
]
docs = [
    # sphinx 8.2 dropped Python 3.10; docs are built on 3.11 (see docs.yml),
    # but the resolver still has to satisfy requires-python = ">=3.10".
    "sphinx>=8.2 ; python_full_version >= '3.11'",
    "sphinx>=8.1 ; python_full_version < '3.11'",
    "sphinx-book-theme",
    "sphinx-design>=0.5.0",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-nb>=1.1",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
]

[project.urls]
Homepage = "https://github.com/CUB-CORR/corr_vars"
Documentation = "https://docs.corr-vars.de"
"Bug Tracker" = "https://github.com/CUB-CORR/corr_vars/issues"
Source = "https://github.com/CUB-CORR/corr_vars"

[tool.hatch.version]
path = "src/corr_vars/__init__.py"

[tool.hatch.build.targets.wheel]
# Every non-gitignored file under src/corr_vars ships: code plus package data
# (concepts/routing.toml, sources/**/mapping/*.json, style/matplotlibrc, ...).
packages = ["src/corr_vars"]

[tool.hatch.build.targets.sdist]
include = [
    "src/corr_vars",
    "/README.md",
    "/LICENSE.md",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
# A bare `pytest` runs the offline suite only. tests/sources needs local data
# and Concepts API credentials, so it runs only when named explicitly.
testpaths = ["tests/integration"]
markers = [
    "db: marks tests requiring a live database connection",
]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
omit = []

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    # "def __repr__",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, protocols, etc. they aren't run:
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.pyright]
include = ["src"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "src/experimental",
    "src/typestubs",
]
stubPath = "src/stubs"
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
defineConstant = {DEBUG = true}
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateImportUsage = "warning"
reportUnboundVariable = "error"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"

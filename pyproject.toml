[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "corr_vars"
dynamic = ["version"]
description = "Build reproducible clinical study cohorts from ICU and hospital data sources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Moritz Thiele", email = "moritz.thiele@charite.de"},
    {name = "Pedram Ramezani", email = "pedram.ramezani@charite.de"},
]
maintainers = [
    {email = "noel.kronenberg@charite.de"},
    {email = "dario.von-wedel@charite.de"},
]
dependencies = [
    # Main
    "corr_vars_widget>=0.0.8",
    "numpy>=2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.0.0",
    "polars>=1.31.0",
    "tableone>=0.7.10",
    "scipy>=1.10.0",
    "tqdm>=4.65",
    "xlsxwriter>=3.2.5",
    "zstandard>=0.23.0",
    # Plot
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "networkx>=3.4.1",
    "seaborn>=0.13.2",
    "httpx>=0.27",
    "tomli>=2.0 ; python_full_version < '3.11'",
    "scikit-learn>=1.6.1,<1.7",
]

[project.optional-dependencies]
# Optional bootstrap of a PyStata session (``CORR_VARS_STATA_DIR``). Cohort's
# Stata *export* works without it.
stata = ["stata_setup>=0.1.3"]

[dependency-groups]
test = [
    "hypothesis>=6.151.3",
    "pytest>=8.3.3",
    "pytest-xdist>=3.6.1",
]
docs = [
    # sphinx 8.2 dropped Python 3.10; docs are built on 3.11 (see docs-gh.yml),
    # but the resolver still has to satisfy requires-python = ">=3.10".
    "sphinx>=8.2 ; python_full_version >= '3.11'",
    "sphinx>=8.1 ; python_full_version < '3.11'",
    "sphinx-book-theme",
    "sphinx-design>=0.5.0",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
]

[project.urls]
Homepage = "https://github.com/CUB-CORR/corr-vars"
Documentation = "https://docs.corr-vars.de"
"Bug Tracker" = "https://github.com/CUB-CORR/corr-vars/issues"

[tool.hatch.version]
path = "src/corr_vars/__init__.py"

[tool.hatch.build]
packages = ["src/corr_vars"]
include = [
    "src/corr_vars/concepts/*.toml",
    "src/corr_vars/sources/**/*.json",
    "src/corr_vars/sources/**/*.yaml",
    "src/corr_vars/sources/**/*.csv",
    "src/corr_vars/sources/**/*.parquet",
    "src/corr_vars/sources/**/*.pkl",
    "src/corr_vars/style/*.rc",
]

[tool.coverage.run]
branch = true
omit = []

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    # "def __repr__",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, protocols, etc. they aren't run:
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.pyright]
include = ["src"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "src/experimental",
    "src/typestubs",
]
stubPath = "src/stubs"
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
defineConstant = {DEBUG = true}
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateImportUsage = "warning"
reportUnboundVariable = "error"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"

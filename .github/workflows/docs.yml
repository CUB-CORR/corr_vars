name: Build Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group docs --python 3.11

      - name: Build Sphinx documentation
        run: uv run sphinx-build -M html docs docs/_build

      # Pull requests only build, so a broken docs build fails the check.
      # Pushes to main publish the HTML to the orphan `docs-html` branch.
      - name: Publish HTML to docs branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: docs
          force_orphan: true
          commit_message: "docs: build ${{ github.sha }}"

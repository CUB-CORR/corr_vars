name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c "
          import re, pathlib
          text = pathlib.Path('src/corr_vars/__init__.py').read_text()
          print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))
          ")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build the distributions
        run: uv build

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
